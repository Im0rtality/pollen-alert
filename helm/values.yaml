image:
  repository: ghcr.io/laurynas/pollen-alert
  tag: latest
  pullPolicy: Always

# Deployment settings (passed as env vars, not in config file)
metricsPort: 8080

# User config — rendered into /config/pollen-alert.toml via ConfigMap.
# Supported allergens: ALDER, BIRCH, HAZEL, GRASS, RAGWEED, MUGWORT
config:
  # Use either city (geocoded via Nominatim) or explicit coordinates.
  # If city is set, latitude/longitude are ignored.
  city: ""
  latitude: ""
  longitude: ""
  lookaheadHours: 24
  fetchIntervalHours: 1
  notifyHours:
    - 5
  timezone: "UTC"
  allergens:
    - name: BIRCH
      threshold: 81

# imagePullSecrets:
#   - name: ghcr-pull-secret

# Secrets are passed at install time:
#   helm install pollen-alert ./helm \
#     --set secrets.pushoverToken=xxx \
#     --set secrets.pushoverUserKey=yyy
secrets:
  pushoverToken: ""
  pushoverUserKey: ""

serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}

# Persistent volume for dataset resolution cache and readings.
persistence:
  enabled: true
  size: 1Mi
  storageClass: ""  # use cluster default
