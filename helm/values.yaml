image:
  repository: ghcr.io/laurynas/pollen-alert
  tag: latest
  pullPolicy: Always

# Cron schedule (UTC). 5:00 UTC = 8:00 EEST / 7:00 EET
schedule: "0 5 * * *"

config:
  latitude: "YOUR_LATITUDE"
  longitude: "YOUR_LONGITUDE"
  lookaheadHours: ""  # leave empty to use script default (24h)

# Allergens to monitor with per-allergen notification thresholds (grains/m³).
# Supported allergens (silam_hires_pollen_v6_1 dataset): ALDER, BIRCH, HAZEL, GRASS, RAGWEED, MUGWORT
#
# EAN thresholds and SILAM variable names are defined per-allergen in pollen_alert.py.
allergens:
  - name: BIRCH
    threshold: 81

# imagePullSecrets:
#   - name: ghcr-pull-secret

# Secrets are passed at install time:
#   helm install pollen-alert ./helm \
#     --set secrets.pushoverToken=xxx \
#     --set secrets.pushoverUserKey=yyy
secrets:
  pushoverToken: ""
  pushoverUserKey: ""

# Persistent volume for dataset resolution cache.
# Without this the dataset is re-probed on every CronJob run.
persistence:
  enabled: true
  size: 1Mi
  storageClass: ""  # use cluster default
