apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pollen-alert.fullname" . }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: pollen-alert
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: LATITUDE
                  value: {{ .Values.config.latitude | quote }}
                - name: LONGITUDE
                  value: {{ .Values.config.longitude | quote }}
                - name: PUSHOVER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "pollen-alert.fullname" . }}-secrets
                      key: pushoverToken
                - name: PUSHOVER_USER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "pollen-alert.fullname" . }}-secrets
                      key: pushoverUserKey
                {{- if .Values.persistence.enabled }}
                - name: CACHE_FILE
                  value: /cache/dataset.json
              volumeMounts:
                - name: cache
                  mountPath: /cache
                {{- end }}
          {{- if .Values.persistence.enabled }}
          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: {{ include "pollen-alert.fullname" . }}-cache
          {{- end }}
